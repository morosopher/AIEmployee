# 本地开发覆盖层：仅允许使用未提交的本地 Secret 文件，并保留源代码热更新。
x-m2-write-environment: &m2-write-environment
  EXTERNAL_WRITES_ENABLED: "${EXTERNAL_WRITES_ENABLED:-false}"
  GOOGLE_WRITES_ENABLED: "${GOOGLE_WRITES_ENABLED:-false}"
  MICROSOFT_WRITES_ENABLED: "${MICROSOFT_WRITES_ENABLED:-false}"
  WRITE_TEST_ACCOUNT_ALLOWLIST: "${WRITE_TEST_ACCOUNT_ALLOWLIST:-[]}"
  MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
  MICROSOFT_CLIENT_SECRET_FILE: /run/secrets/microsoft_client_secret
  MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/connections/microsoft/callback}"

services:
  caddy:
    build:
      target: build
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    working_dir: /app
    environment:
      APP_DOMAIN: localhost
      API_BASE_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # 开发环境只供本机访问；替换生产端口列表，避免合并后仍发布 80/443。
    ports: !override
      - "127.0.0.1:5173:5173"

  api:
    # file Secret 保留宿主 inode 的 0600 权限，开发进程使用其所有者 UID/GID。
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *m2-write-environment
      APP_ENV: development
      APP_BASE_URL: http://localhost:5173
    # 复用生产的不含密码 DSN，启动时读取应用角色 Secret；OAuth query 不进入 access log。
    command: ["/bin/sh", "-ec", "export PGPASSWORD=\"$$(cat /run/secrets/app_database_password)\"; exec uvicorn ai_employee.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      # 宿主虚拟环境可能使用不同的 Python 路径，镜像依赖必须由独立卷保留。
      - backend_venv:/app/backend/.venv

  worker:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *m2-write-environment
      APP_ENV: development
    volumes:
      - ./backend:/app/backend
      - backend_venv:/app/backend/.venv

  scheduler:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *m2-write-environment
      APP_ENV: development
    volumes:
      - ./backend:/app/backend
      - backend_venv:/app/backend/.venv

# 生产基线把 Secret 标为 external；开发层必须显式复位，避免合并后同时出现 external 与 file。
secrets:
  postgres_bootstrap_password:
    external: false
    file: ./secrets/development/postgres_bootstrap_password
  app_database_password:
    external: false
    file: ./secrets/development/app_database_password
  retention_database_password:
    external: false
    file: ./secrets/development/retention_database_password
  retention_database_url:
    external: false
    file: ./secrets/development/retention_database_url
  app_master_key:
    external: false
    file: ./secrets/development/app_master_key
  google_client_secret:
    external: false
    file: ./secrets/development/google_client_secret
  microsoft_client_secret:
    external: false
    file: ./secrets/development/microsoft_client_secret
  model_api_key:
    external: false
    file: ./secrets/development/model_api_key
  backup_passphrase:
    external: false
    file: ./secrets/development/backup_passphrase
  grafana_admin_password:
    external: false
    file: ./secrets/development/grafana_admin_password

volumes:
  frontend_node_modules:
  backend_venv:
    # 空卷只在首次挂载时复制镜像依赖；按不可变标签换卷，避免升级后仍使用上一版依赖。
    name: "${COMPOSE_PROJECT_NAME:-ai-employee}-backend-venv-${APP_IMAGE_TAG:?APP_IMAGE_TAG must name an immutable image tag}"
