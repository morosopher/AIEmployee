name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: ai_employee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --label ai_employee.ci_run=${{ github.run_id }}
          --label ai_employee.ci_attempt=${{ github.run_attempt }}
          --label ai_employee.ci_job=verify
          --label ai_employee.ci_role=target
          --health-cmd "pg_isready -U postgres -d ai_employee_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports:
          - 127.0.0.1:5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install locked dependencies and browser
        run: |
          uv sync --project backend --all-groups --frozen
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Create synthetic secret files and prepare database anchor
        shell: bash
        # 精确服务 ID 和创建时标签共同绑定归属；CI 布尔标志不提供写入 authority。
        env:
          CI_DATABASE_CONTAINER_ID: ${{ job.services.postgres.id }}
          CI_DATABASE_RUN_ID: ${{ github.run_id }}
          CI_DATABASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_DATABASE_JOB: verify
        run: |
          set -euo pipefail
          umask 077
          secret_dir="${RUNNER_TEMP}/ai-employee-secrets"
          mkdir -p "${secret_dir}"
          printf '%s' 'ci-app-role-password' >"${secret_dir}/app_database_password"
          printf '%s' 'ci-retention-role-password' >"${secret_dir}/retention_database_password"
          # 应用要求 Base64URL 解码后恰好 32 字节；随机合成密钥只在本次 CI Job 内存活。
          openssl rand -base64 32 >"${secret_dir}/app_master_key"
          printf '%s' 'ci-google-client-secret' >"${secret_dir}/google_client_secret"
          printf '%s' 'ci-model-api-key' >"${secret_dir}/model_api_key"
          printf '%s' 'ci-backup-passphrase' >"${secret_dir}/backup_passphrase"
          export TEST_DATABASE_URL=postgresql+asyncpg://postgres:ci-postgres-password@127.0.0.1:5432/ai_employee_test
          export APP_MASTER_KEY_FILE="${secret_dir}/app_master_key"
          # 独立 donor 的 typed bootstrap/0018 迁移产生精确空基线；target 必须保持 fixed roles absent。
          just prepare-ci-database
          {
            echo "TEST_DATABASE_URL=${TEST_DATABASE_URL}"
            echo "TEST_REDIS_URL=redis://localhost:6379/15"
            echo "E2E_ADMIN_EMAIL=ci-admin@example.test"
            echo "E2E_ADMIN_PASSWORD_FILE=${secret_dir}/app_database_password"
            echo "APP_MASTER_KEY_FILE=${secret_dir}/app_master_key"
            echo "GOOGLE_CLIENT_SECRET_FILE=${secret_dir}/google_client_secret"
            echo "MODEL_API_KEY_FILE=${secret_dir}/model_api_key"
          } >>"${GITHUB_ENV}"

      - name: Run repository quality gate
        run: just ci

      - name: Upload browser traces and coverage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          if-no-files-found: ignore
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/coverage
            backend/coverage
