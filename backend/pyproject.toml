[project]
name = "ai-employee"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  # Babel 使用 BSD 许可证且仍在维护；本里程碑仅用于 CLDR Windows/IANA 时区映射，
  # 不把 Babel 类型或本地化能力暴露到 application/domain 层。
  "babel>=2.17,<3",
  "beautifulsoup4>=4.13,<5",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.3,<4",
  # PyJWT 采用 MIT 许可证且仍有维护；仅用于 Microsoft OIDC ID token 的 discovery/JWKS
  # 签名验证，所有 claims 必须经过签名、audience、issuer、exp 与 nonce 校验后才能使用。
  # 禁止把未验证 JWT parser 暴露到 application/domain 层。
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sse-starlette>=3,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25,<26",
  "taskiq>=0.11,<1",
  "taskiq-redis>=1,<2",
  # tzdata 采用 Apache-2.0 许可证且持续维护；仅为 zoneinfo 提供锁定的 IANA 数据，
  # 防止 Microsoft 时区校验静默依赖宿主镜像是否安装系统时区数据库。
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_employee"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
