# Prometheus 只抓取 Compose 内网指标端点，不保存任何业务或应用密钥。
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9102"]
