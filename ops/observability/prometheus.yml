# Prometheus 只抓取 Compose 内网指标端点，不保存任何业务或应用密钥。
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# 规则文件由 Compose 以只读挂载提供，避免本地存在而部署时不可见。
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9102"]
